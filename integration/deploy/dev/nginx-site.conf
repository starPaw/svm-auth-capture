# Render with ops/dev_environment.py. Add to sites-enabled only after TLS exists.
server {
    listen 80;
    listen [::]:80;
    server_name @DEV_HOST@;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/capture402-dev-acme;
    }
    location / { return 308 https://@DEV_HOST@$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @DEV_HOST@;
    ssl_certificate /etc/letsencrypt/live/@DEV_HOST@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DEV_HOST@/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/capture402-dev-access.log;
    error_log /var/log/nginx/capture402-dev-error.log warn;
    # Private allowlist: loopback plus explicitly admitted tester IPs, then deny all.
    # This avoids Basic/Bearer Authorization header conflicts for merchant requests.
    include /etc/capture402-dev/nginx-access.conf;
    include /etc/nginx/snippets/capture402-dev-routes.conf;
}
