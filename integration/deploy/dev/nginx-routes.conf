# Included only by the separate dev virtual host. The facilitator stays private.
large_client_header_buffers 4 16k;
client_max_body_size 32k;
add_header X-Capture402-Environment development always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Cache-Control "no-store" always;
proxy_hide_header Cache-Control;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Connection "";
proxy_pass_request_headers on;
proxy_intercept_errors off;
proxy_buffering off;
proxy_next_upstream off;
proxy_connect_timeout 5s;
proxy_read_timeout 450s;
proxy_send_timeout 450s;
location = / {
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:18888;
}
location ~ "^/(customer|merchant|assets/(homepage\\.css|homepage\\.js|app\\.js|receipt-state\\.js|wallet\\.js|solflare\\.js|solflare\\.js\\.LEGAL\\.txt|style\\.css)|api/config)$" {
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:18888;
}
location = /resource {
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    proxy_pass http://127.0.0.1:18888;
}
location = /api/orders {
    if ($request_method != POST) { return 405; }
    proxy_pass http://127.0.0.1:18888;
}
location ~ "^/api/orders/[a-f0-9]{32}/signing-preflight$" {
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:18888;
}
location ~ "^/api/orders/[a-f0-9]{32}/(wallet-consent|reclaim-renewal|abandon-authorize)$" {
    if ($request_method != POST) { return 405; }
    proxy_pass http://127.0.0.1:18888;
}
location ~ "^/api/orders/[a-f0-9]{32}(/actions/(beer|salmon|finish|void|refund|atomic)|/reclaim)?$" {
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    proxy_pass http://127.0.0.1:18888;
}
location / { return 404; }
