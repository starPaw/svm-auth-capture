# Include in capture402.xyz's existing HTTPS server; preserve its TLS directives.
large_client_header_buffers 4 16k;
client_max_body_size 32k;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Connection "";
proxy_pass_request_headers on;
proxy_intercept_errors off;
proxy_buffering off;
proxy_connect_timeout 5s;
proxy_read_timeout 450s;
proxy_send_timeout 450s;
location = / {
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:8788;
}
location ~ "^/(customer|merchant|assets/(app\\.js|wallet\\.js|solflare\\.js|solflare\\.js\\.LEGAL\\.txt|style\\.css)|api/config)$" {
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:8788;
}
location = /resource {
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    proxy_pass http://127.0.0.1:8788;
}
location = /api/orders {
    if ($request_method != POST) { return 405; }
    proxy_pass http://127.0.0.1:8788;
}
location ~ "^/api/orders/[a-f0-9]{32}(/actions/(beer|salmon|finish|void|refund)|/reclaim)?$" {
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    proxy_pass http://127.0.0.1:8788;
}
location /api/ { return 404; }
location /assets/ { return 404; }
# Facilitator endpoints stay private.
location = /settle { return 404; }
location = /verify { return 404; }
location = /supported { return 404; }
